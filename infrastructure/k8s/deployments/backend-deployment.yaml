apiVersion: apps/v1
kind: Deployment
metadata:
  name: soundlog-backend
  namespace: soundlog
spec:
  replicas: 2
  selector:
    matchLabels: { app: soundlog-backend }
  template:
    metadata:
      labels: { app: soundlog-backend }
    spec:
      containers:
        - name: backend
          image: soundlog/backend:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: soundlog-config }
            - secretRef: { name: soundlog-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
