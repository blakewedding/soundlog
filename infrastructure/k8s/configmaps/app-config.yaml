apiVersion: v1
kind: ConfigMap
metadata:
  name: soundlog-config
  namespace: soundlog
data:
  NODE_ENV: production
  PORT: "4000"
  ELASTICSEARCH_NODE: http://elasticsearch:9200
  REDIS_URL: redis://redis:6379
# Secrets (DATABASE_URL, JWT_SECRET, API keys) belong in a K8s Secret —
# never in this file or baked into images.
