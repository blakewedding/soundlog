server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API, via the Varnish edge. One origin serves the SPA and /api, which is
    # what makes the refresh cookie same-origin (see CLIENT_URL in env.ts).
    location /api/ {
        proxy_pass http://varnish:80;

        # Avatar uploads are the only large request bodies this app has, and
        # nginx's default `client_max_body_size` is 1m — so a perfectly ordinary
        # phone photo was rejected HERE, by the proxy, with a bare 413 and an
        # HTML body, before Express or the validation gauntlet ever saw a byte.
        # The API advertises a 5 MB limit and the gauntlet answers oversize with
        # a specific reason; neither is worth anything if a proxy silently
        # overrules them two hops earlier.
        #
        # 6m, deliberately ABOVE the app's 5 MB ceiling rather than equal to it.
        # The app should be the thing that refuses an oversized upload, because
        # only the app can say WHY — nginx can only emit a status code. Leaving
        # headroom means every upload a person is plausibly making reaches the
        # code that can explain itself.
        #
        # This does not widen the JSON endpoints: `express.json({ limit: "1mb" })`
        # still caps those in the app, and `express.raw` caps the avatar at 5 MB.
        # The host nginx in front of this already allows 12m.
        client_max_body_size 6m;

        # NOT optional, and the reason a whole class of mutations 400'd through
        # this proxy while working directly against Varnish:
        #
        # nginx speaks HTTP/1.0 upstream by default, and for a request with an
        # EMPTY body it then sends no Content-Length at all. Varnish rejects
        # that — an HTTP/1.0 POST with neither Content-Length nor
        # Transfer-Encoding is a 400 Bad Request — so every bodyless mutation
        # (follow, unfollow, like, log listen, delete) failed at the edge while
        # POSTs that happened to carry a body (register, login, review) went
        # through. Verified against this stack: HTTP/1.1 → 200, HTTP/1.0 with
        # the header stripped → 400.
        proxy_http_version 1.1;
        # With 1.1, an empty Connection header is what enables upstream
        # keepalive instead of a new connection per request.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind TLS termination this is how the app learns the real scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cover art, proxied and re-encoded by the backend. This location exists
    # because of the `location /` fallback below: without it, `try_files` would
    # answer every /covers/ request with index.html — a 200 carrying HTML, which
    # a browser renders as a broken image rather than as an error anyone notices.
    #
    # Cache-Control is set by the origin (a year, immutable, because the URL
    # encodes both the upstream image and the width) and deliberately NOT
    # overridden here: the 503 an unreachable Cover Art Archive produces carries
    # `no-store`, and a blanket add_header would cache that failure at the edge.
    location /covers/ {
        proxy_pass http://varnish:80;
        # Same HTTP/1.1 + empty Connection contract as /api/ above.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User avatars (6.2). Here for exactly the same reason as /covers/ above:
    # without this location the `location /` fallback answers with index.html,
    # and every avatar on the site is a 200 that renders as a broken image.
    #
    # Cache-Control again comes from the origin — a year, immutable, honest
    # because the filename contains a hash of the uploaded bytes, so a new
    # picture is a new URL. A short-lived 404 is the one other answer, and it
    # must not be pinned here either: it usually means the edge asked for the
    # hash the row held a moment ago.
    location /avatars/ {
        proxy_pass http://varnish:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed asset filenames, so these are safe to pin
    # forever — a deploy changes the name, never the contents of a name.
    # One directive, not `expires 1y` plus an add_header — those emit TWO
    # Cache-Control headers and the client picks one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA shell, by contrast, must never be cached: it is the document that
    # names the current asset hashes. A cached index.html keeps pointing at the
    # previous deploy's bundles, which are gone.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
