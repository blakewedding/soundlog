<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soundlog — Log the music that matters</title>

    <!-- Search-engine description. Deliberately IDENTICAL to og:description
         below: a search result and a social card that describe the same site
         differently is a drift nobody notices until one of them is wrong.
         Change them together or not at all. -->
    <meta
      name="description"
      content="A listening diary for people who live in music. Log albums, write reviews, build lists, track your collection."
    />

    <!-- Social share (Open Graph + Twitter cards).

         THESE LIVE IN STATIC MARKUP AND MUST STAY THERE. Slack, iMessage,
         Twitter/X, Discord and Facebook fetch the HTML and parse it; not one of
         them runs our JavaScript. A <meta> injected by React after hydration is
         invisible to every unfurler on earth, so a per-route head library would
         look like it worked in devtools and change nothing in a paste. The app
         has no such library today — this file is the only head there is.

         Consequence worth knowing before anyone files it as a bug: the card is
         therefore the SAME for every route. /release/… and /user/… unfurl as
         "Soundlog", not as the album or the person. Per-route cards need the
         server to render per-route HTML (an Express route that serves index.html
         with substituted tags for crawler paths, or prerendering); that is a
         backend change, not a tag.

         URLs are ABSOLUTE and must remain so. Unfurlers resolve og:image
         against nothing — a relative path is simply dropped, and the card
         silently degrades to text with no error anywhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soundlog.app" />
    <meta property="og:title" content="Soundlog — Log every listen" />
    <meta
      property="og:description"
      content="A listening diary for people who live in music. Log albums, write reviews, build lists, track your collection."
    />
    <meta property="og:image" content="https://soundlog.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://soundlog.app/og.png" />

    <!-- Brand v3 icon ladder — the finalized eighth-note/L mark. Shipped as
         authored (brand/); never recoloured, never regenerated from geometry.

         `?v=3` is load-bearing. Vite fingerprints what it bundles, but files in
         public/ are copied verbatim with their names intact, so a favicon has no
         content hash to invalidate it. Browsers cache favicons hard and by
         origin — without the query, a returning visitor keeps the old Groove
         glyph in the tab indefinitely. Bump this when the artwork changes. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Soundlog_Favicon_32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Soundlog_Favicon_16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Soundlog_AppleTouchIcon_180.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics — served from source, not injected at the edge,
         so the one script we ship is visible to anyone reading this file.

         The token is a PUBLIC site identifier, not a credential: Cloudflare puts
         it in the markup of every page it serves. §7 governs secrets; this is
         not one, and hiding it in .env would imply a confidentiality it lacks.

         `defer`, per Cloudflare's DOCUMENTED snippet — analytics must never
         block the parser, first paint, or the app bundle.

         Deliberately NOT type="module", and this WILL look like a mistake to
         anyone comparing against the dashboard: Cloudflare's dashboard hands
         you a `type='module'` variant, while their documentation specifies
         `defer`. They disagree. beacon.min.js is a classic script, so module
         loading would impose CORS-mode fetching and module scope on it for no
         benefit. If you re-copy from the dashboard, keep `defer`.

         The src is deliberately UNVERSIONED. Edge injection pins a /v<hash>
         build and rotates that hash; a pinned copy here would quietly go stale.

         The attribute is SINGLE-quoted because its value is a JSON document.
         Double-quoting it requires escaping the inner quotes, and a mis-escaped
         version parses as an empty token — the beacon then loads and silently
         reports nothing while View Source looks right. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "3fcb36cb89124455b95b7900e9d9cafd"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
